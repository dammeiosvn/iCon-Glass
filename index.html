<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glass">
<meta name="theme-color" content="#F4F0E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12110E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Glass</title>
<style>
  :root {
    color-scheme: light dark;
    --paper: #F4F0E8;
    --ink: #1C1915;
    --cad: #C4492C;
    --bg: light-dark(#F4F0E8, #12110E);
    --fg: light-dark(#1C1915, #F4F0E8);
    --muted: light-dark(#6f675c, #a39b90);
    --card: light-dark(rgba(255,255,255,.62), rgba(255,255,255,.07));
    --stroke: light-dark(rgba(28,25,21,.1), rgba(255,255,255,.14));
    --fill: light-dark(rgba(255,255,255,.5), rgba(255,255,255,.08));
    --track: light-dark(rgba(28,25,21,.12), rgba(255,255,255,.16));
    --shadow: light-dark(0 10px 30px rgba(28,25,21,.08), 0 12px 32px rgba(0,0,0,.35));
    --safe-t: env(safe-area-inset-top);
    --safe-b: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
  body { padding: calc(10px + var(--safe-t)) 14px calc(16px + var(--safe-b)); }
  button, input, select { font: inherit; color: inherit; }
  h1 { font-size: 22px; letter-spacing: -.03em; margin: 0; font-weight: 680; }
  .top {
    display: grid;
    grid-template-columns: 148px 1fr;
    gap: 12px;
    align-items: start;
  }
  .stage {
    background: light-dark(#1c1a16, #0c0b09);
    border-radius: 28px;
    padding: 12px;
    box-shadow: var(--shadow);
  }
  canvas { width: 100%; height: auto; display: block; border-radius: 18px; }
  .head { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .menu, .pills, .shapes, .actions { display: flex; gap: 8px; }
  .menu { flex-wrap: wrap; }
  .pill, .shape, .act, select, input[type="text"] {
    border: 1px solid var(--stroke);
    background: var(--fill);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 999px;
    box-shadow: inset 0 1px 0 light-dark(rgba(255,255,255,.7), rgba(255,255,255,.16));
  }
  .pill, .shape { padding: 8px 12px; }
  .pill.on, .shape.on { background: var(--cad); color: #fff; border-color: transparent; }
  .panel { display: none; margin-top: 14px; }
  .panel.on { display: block; }
  .card {
    background: var(--card);
    border: 1px solid var(--stroke);
    border-radius: 22px;
    padding: 12px;
    backdrop-filter: blur(18px);
    box-shadow: var(--shadow);
  }
  .card + .card { margin-top: 10px; }
  .shapes { flex-wrap: wrap; }
  .shape { width: 46px; height: 46px; padding: 0; display: grid; place-items: center; }
  .shape svg { width: 22px; height: 22px; }
  .slide { margin-top: 12px; }
  .slide b { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .slide b span { color: var(--muted); font-weight: 550; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 8px; border-radius: 999px;
    background: linear-gradient(90deg, var(--cad) var(--p, 40%), var(--track) var(--p, 40%));
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px; margin-top: -7px; border-radius: 50%;
    background: #fff; border: 1px solid var(--stroke); box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field b { display: block; font-size: 13px; margin-bottom: 6px; }
  input[type="color"] { width: 100%; height: 36px; border: 0; background: transparent; padding: 0; }
  input[type="text"], select { width: 100%; padding: 10px 12px; border-radius: 14px; }
  .layers { display: flex; flex-direction: column; gap: 8px; }
  .layer { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .actions { margin-top: 14px; display: grid; grid-template-columns: repeat(4, 1fr); }
  .act {
    border-radius: 18px; min-height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px 4px;
  }
  .act svg { width: 22px; height: 22px; }
  .act span { font-size: 11px; font-weight: 600; }
  .act.primary { background: var(--cad); color: #fff; border-color: transparent; }
  html[data-layout="pad"] .top, html[data-layout="desk"] .top { grid-template-columns: 280px 1fr; }
  html[data-layout="desk"] body, html[data-layout="desk"] { }
  html[data-layout="desk"] .wrap { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
  html[data-layout="desk"] .top { display: block; position: sticky; top: 12px; }
  html[data-layout="desk"] .stage { padding: 16px; }
  @media (min-width: 900px) {
    body { padding-left: 20px; padding-right: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="stage"><canvas id="c" width="1024" height="1024"></canvas></div>
    <div class="head">
      <h1>Glass</h1>
      <nav class="menu" id="menu">
        <button class="pill on" data-tab="shape">Hình</button>
        <button class="pill" data-tab="layer">Lớp</button>
        <button class="pill" data-tab="glass">Kính</button>
        <button class="pill" data-tab="out">Xuất</button>
      </nav>
    </div>
  </div>

  <div>
    <section class="panel on" id="shape">
      <div class="card">
        <div class="shapes" id="shapes"></div>
        <div class="slide">
          <b>Chữ <span id="glyphv"></span></b>
          <input id="glyph" type="text" maxlength="2" placeholder="A">
        </div>
      </div>
    </section>

    <section class="panel" id="layer">
      <div class="card">
        <div class="pills">
          <button class="pill" id="add">Thêm lớp</button>
          <button class="pill" id="upload">Tải ảnh</button>
          <input id="file" type="file" accept="image/*,.svg" hidden>
        </div>
        <div class="layers" id="layers"></div>
      </div>
    </section>

    <section class="panel" id="glass">
      <div class="card">
        <div class="pair">
          <label class="field"><b>Màu kính</b><input id="tint" type="color" value="#7ec8ff"></label>
          <label class="field"><b>Nền tấm</b><input id="plate" type="color" value="#f3eee4"></label>
        </div>
        <div class="slide"><b>Độ đục <span id="opv">46</span></b><input id="op" type="range" min="18" max="82" value="46"></div>
        <div class="slide"><b>Viền sáng <span id="rimv">70</span></b><input id="rim" type="range" min="8" max="100" value="70"></div>
        <div class="slide"><b>Óng ánh <span id="iriv">35</span></b><input id="iri" type="range" min="0" max="100" value="35"></div>
        <div class="slide"><b>Bo góc <span id="radv">22</span></b><input id="rad" type="range" min="16" max="34" value="22"></div>
        <div class="slide"><b>Đổ bóng <span id="shv">55</span></b><input id="sh" type="range" min="0" max="100" value="55"></div>
        <div class="slide"><b>Cỡ hình <span id="scv">74</span></b><input id="sc" type="range" min="40" max="96" value="74"></div>
        <div class="pills" style="margin-top:12px">
          <button class="pill on" data-shadow="contact">Tiếp xúc</button>
          <button class="pill" data-shadow="soft">Mềm</button>
          <button class="pill" data-shadow="float">Nổi</button>
        </div>
        <div class="pills" style="margin-top:8px">
          <button class="pill on" id="plateOn">Tấm nền</button>
          <button class="pill" id="clearOn">Nền trong</button>
        </div>
      </div>
    </section>

    <section class="panel" id="out">
      <div class="card">
        <label class="field"><b>Tên</b><input id="name" type="text" value="Glass"></label>
        <div class="slide"></div>
        <label class="field"><b>URL Pages</b><input id="url" type="text" placeholder="https://user.github.io/glass-icon/"></label>
        <div class="pills" style="margin-top:12px">
          <button class="pill" id="savePreset">Lưu mẫu</button>
          <select id="presets"></select>
        </div>
      </div>
    </section>

    <div class="actions">
      <button class="act primary" id="png1024"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 21h16"/></svg><span>1024</span></button>
      <button class="act" id="png180"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 12h8"/></svg><span>180</span></button>
      <button class="act" id="pack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16v12H4z"/><path d="M8 7V5h8v2"/></svg><span>Bộ</span></button>
      <button class="act" id="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Hồ sơ</span></button>
    </div>
  </div>
</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const shapes = [
  ['flower','Hoa'],['mail','Thư'],['folder','Mục'],['list','Danh'],['gear','Máy'],['g','G']
];
let symbol = 'flower';
let shadowMode = 'contact';
let plateOn = true;
let layers = [];
const KEY = 'glass-icon-presets';

function layout() {
  const w = Math.min(window.innerWidth, screen.width || window.innerWidth);
  document.documentElement.dataset.layout = w < 520 ? 'phone' : w < 900 ? 'pad' : 'desk';
}
layout();
addEventListener('resize', layout);

function icon(name) {
  const s = {
    flower: '<circle cx="12" cy="12" r="2"/><ellipse cx="12" cy="6" rx="2.2" ry="3.2"/><ellipse cx="12" cy="18" rx="2.2" ry="3.2"/><ellipse cx="6" cy="12" rx="3.2" ry="2.2"/><ellipse cx="18" cy="12" rx="3.2" ry="2.2"/>',
    mail: '<rect x="4" y="6" width="16" height="12" rx="2"/><path d="M4 8l8 6 8-6"/>',
    folder: '<path d="M3 8h6l2 2h10v9H3z"/>',
    list: '<circle cx="6" cy="7" r="1.4"/><circle cx="6" cy="12" r="1.4"/><circle cx="6" cy="17" r="1.4"/><path d="M10 7h8M10 12h8M10 17h8"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.5 5.5l2 2M16.5 16.5l2 2M18.5 5.5l-2 2M7.5 16.5l-2 2"/>',
    g: '<path d="M16 12h-5"/><path d="M16 8a5 5 0 1 0 1 8"/>'
  }[name];
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${s}</svg>`;
}
const box = document.getElementById('shapes');
shapes.forEach(([id], i) => {
  const b = document.createElement('button');
  b.className = 'shape' + (i ? '' : ' on');
  b.innerHTML = icon(id);
  b.onclick = () => { symbol = id; document.getElementById('glyph').value = ''; [...box.children].forEach(x => x.classList.remove('on')); b.classList.add('on'); draw(); };
  box.appendChild(b);
});

document.getElementById('menu').onclick = e => {
  const t = e.target.closest('[data-tab]');
  if (!t) return;
  document.querySelectorAll('#menu .pill').forEach(x => x.classList.toggle('on', x === t));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === t.dataset.tab));
};
document.querySelectorAll('[data-shadow]').forEach(b => b.onclick = () => {
  shadowMode = b.dataset.shadow;
  document.querySelectorAll('[data-shadow]').forEach(x => x.classList.toggle('on', x === b));
  draw();
});
document.getElementById('plateOn').onclick = e => { plateOn = !plateOn; e.target.classList.toggle('on', plateOn); draw(); };
document.getElementById('clearOn').onclick = e => { plateOn = false; document.getElementById('plateOn').classList.remove('on'); e.target.classList.add('on'); draw(); };

function bind(id, out) {
  const el = document.getElementById(id);
  const paint = () => {
    const min = +el.min, max = +el.max, v = +el.value;
    el.style.setProperty('--p', ((v - min) / (max - min) * 100) + '%');
    if (out) document.getElementById(out).textContent = v;
    draw();
  };
  el.addEventListener('input', paint);
  paint();
}
['op','rim','iri','rad','sh','sc'].forEach(id => bind(id, id + 'v'));
document.getElementById('tint').oninput = draw;
document.getElementById('plate').oninput = draw;
document.getElementById('glyph').oninput = draw;

function hex(h){ const n = parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function glassPath(fn, tint, a) {
  const [r,g,b] = hex(tint);
  ctx.save(); fn(); ctx.clip();
  const grd = ctx.createLinearGradient(200,180,820,860);
  grd.addColorStop(0, `rgba(255,255,255,${0.62})`);
  grd.addColorStop(.42, `rgba(${r},${g},${b},${a})`);
  grd.addColorStop(1, `rgba(${Math.max(r-50,0)},${Math.max(g-40,0)},${Math.max(b-20,0)},${Math.min(a+.2,1)})`);
  ctx.fillStyle = grd; ctx.fillRect(0,0,1024,1024);
  ctx.fillStyle = 'rgba(255,255,255,.28)';
  ctx.beginPath(); ctx.ellipse(430, 340, 180, 70, -.5, 0, 7); ctx.fill();
  ctx.restore();
  ctx.save(); fn();
  ctx.strokeStyle = 'rgba(255,255,255,.75)';
  ctx.lineWidth = 8; ctx.stroke();
  ctx.restore();
}
function flower(cx, cy, s, tint, a) {
  for (let i = 0; i < 8; i++) {
    const ang = i * Math.PI / 4;
    glassPath(() => {
      ctx.beginPath();
      ctx.ellipse(cx + Math.cos(ang)*s*.42, cy + Math.sin(ang)*s*.42, s*.28, s*.18, ang, 0, 7);
    }, tint, a);
  }
  glassPath(() => { ctx.beginPath(); ctx.arc(cx, cy, s*.12, 0, 7); }, '#fff6e8', .9);
}
function mail(cx, cy, s, tint, a) {
  glassPath(() => rr(cx-s*.46, cy-s*.32, s*.92, s*.64, s*.12), tint, a);
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(cx-s*.4, cy-s*.2); ctx.lineTo(cx, cy+s*.12); ctx.lineTo(cx+s*.4, cy-s*.2); ctx.stroke(); ctx.restore();
}
function folder(cx, cy, s, tint, a) {
  glassPath(() => rr(cx-s*.48, cy-s*.1, s*.96, s*.58, s*.1), tint, a);
  glassPath(() => rr(cx-s*.48, cy-s*.34, s*.42, s*.24, s*.08), '#d7ecff', a);
}
function list(cx, cy, s, tint, a) {
  [-.28,0,.28].forEach((dy, i) => {
    glassPath(() => { ctx.beginPath(); ctx.arc(cx-s*.28, cy+dy*s, s*.09, 0, 7); }, ['#7ec8ff','#ff8d7a','#ffc46b'][i], .8);
    glassPath(() => rr(cx-s*.1, cy+dy*s-s*.035, s*.5, s*.07, 20), '#ffffff', .45);
  });
}
function gear(cx, cy, s, tint, a) {
  glassPath(() => {
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a0 = i/8*Math.PI*2, a1 = a0 + .28;
      ctx.lineTo(cx+Math.cos(a0)*s*.46, cy+Math.sin(a0)*s*.46);
      ctx.lineTo(cx+Math.cos(a1)*s*.46, cy+Math.sin(a1)*s*.46);
      ctx.lineTo(cx+Math.cos(a1+.12)*s*.32, cy+Math.sin(a1+.12)*s*.32);
    }
    ctx.closePath();
  }, tint, a);
  glassPath(() => { ctx.beginPath(); ctx.arc(cx, cy, s*.12, 0, 7); }, '#fff', .7);
}
function mark(cx, cy, s, tint, text) {
  const [r,g,b] = hex(tint);
  ctx.save();
  ctx.font = `${s}px -apple-system, BlinkMacSystemFont, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = `rgba(${r},${g},${b},.92)`;
  ctx.shadowColor = `rgba(${r},${g},${b},.45)`; ctx.shadowBlur = 24;
  ctx.fillText(text, cx, cy+s*.06);
  ctx.shadowBlur = 0; ctx.globalCompositeOperation = 'soft-light';
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fillText(text, cx, cy);
  ctx.restore();
}
function drawShape(id, tint, a, sc, text, img) {
  const s = 1024 * sc / 100;
  if (img) {
    ctx.save(); ctx.globalAlpha = a; ctx.drawImage(img, 512-s/2, 512-s/2, s, s); ctx.restore();
    return;
  }
  if (text) return mark(512, 530, s*.7, tint, text);
  if (id === 'flower') flower(512, 520, s, tint, a);
  else if (id === 'mail') mail(512, 530, s, tint, a);
  else if (id === 'folder') folder(512, 530, s, tint, a);
  else if (id === 'list') list(512, 520, s, tint, a);
  else if (id === 'gear') gear(512, 520, s, tint, a);
  else mark(512, 540, s*.8, tint, 'G');
}
function shadow(amount) {
  const y = shadowMode === 'float' ? 860 : shadowMode === 'soft' ? 800 : 790;
  const blur = shadowMode === 'float' ? 50 : shadowMode === 'soft' ? 36 : 16;
  ctx.save();
  ctx.fillStyle = `rgba(40,30,20,${amount/180})`;
  ctx.filter = `blur(${blur}px)`;
  ctx.beginPath(); ctx.ellipse(512, y, 250, shadowMode === 'contact' ? 28 : 48, 0, 0, 7); ctx.fill();
  ctx.restore();
}
function draw() {
  const tint = document.getElementById('tint').value;
  const plate = document.getElementById('plate').value;
  const op = +document.getElementById('op').value / 100;
  const rim = +document.getElementById('rim').value / 100;
  const iri = +document.getElementById('iri').value / 100;
  const rad = (+document.getElementById('rad').value / 100) * 280;
  const sh = +document.getElementById('sh').value;
  const sc = +document.getElementById('sc').value;
  const text = document.getElementById('glyph').value.trim();
  ctx.clearRect(0,0,1024,1024);
  if (plateOn) {
    rr(36,36,952,952,214);
    const g = ctx.createLinearGradient(36,36,988,988);
    g.addColorStop(0, plate); g.addColorStop(1, '#e4dccf');
    ctx.fillStyle = g; ctx.fill();
  }
  shadow(sh);
  ctx.save(); rr(118,118,788,788,rad); ctx.clip();
  const body = ctx.createLinearGradient(118,118,906,906);
  body.addColorStop(0, `rgba(255,255,255,${.45+rim*.2})`);
  body.addColorStop(.5, `rgba(${hex(tint).join(',')},${op})`);
  body.addColorStop(1, `rgba(255,255,255,${.12})`);
  ctx.fillStyle = body; ctx.fillRect(118,118,788,788);
  ctx.restore();
  drawShape(symbol, tint, op, sc, text);
  layers.forEach(l => drawShape(l.id, l.tint, l.a, l.sc, l.text, l.img));
  ctx.save(); rr(118,118,788,788,rad);
  ctx.lineWidth = 12;
  ctx.strokeStyle = `rgba(255,255,255,${.25+rim*.6})`;
  ctx.stroke();
  if (iri) {
    ctx.lineWidth = 7;
    ['#ffb4a2','#ffe08a','#b7f0c8','#9fd4ff','#e4c4ff'].forEach((col, i) => {
      ctx.strokeStyle = col.replace(')', '') ;
      ctx.globalAlpha = iri * .55;
      ctx.setLineDash([80, 360]);
      ctx.lineDashOffset = -i * 90;
      ctx.stroke();
    });
  }
  ctx.restore();
}
function renderLayers() {
  const box = document.getElementById('layers');
  box.innerHTML = '';
  layers.forEach((l, i) => {
    const row = document.createElement('div');
    row.className = 'layer';
    row.innerHTML = `<span>${l.text || l.id}</span>`;
    const x = document.createElement('button');
    x.className = 'pill'; x.textContent = 'Xóa';
    x.onclick = () => { layers.splice(i,1); renderLayers(); draw(); };
    row.appendChild(x); box.appendChild(row);
  });
}
document.getElementById('add').onclick = () => {
  layers.push({ id: symbol, tint: document.getElementById('tint').value, a: .8, sc: +document.getElementById('sc').value - 10, text: document.getElementById('glyph').value.trim() });
  renderLayers(); draw();
};
document.getElementById('upload').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => { layers.push({ id: 'ảnh', tint: '#fff', a: 1, sc: 70, text: '', img }); renderLayers(); draw(); };
  img.src = URL.createObjectURL(f);
};
function exportPNG(size) {
  const out = document.createElement('canvas'); out.width = out.height = size;
  out.getContext('2d').drawImage(c, 0, 0, size, size);
  const a = document.createElement('a');
  a.href = out.toDataURL('image/png');
  a.download = `${document.getElementById('name').value || 'glass'}-${size}.png`;
  a.click();
  return out;
}
document.getElementById('png1024').onclick = () => exportPNG(1024);
document.getElementById('png180').onclick = () => exportPNG(180);
function crc32(buf) {
  let c, t = crc32.t || (crc32.t = Array.from({length:256}, (_,n) => { c = n; for (let k=0;k<8;k++) c = c & 1 ? 0xedb88320 ^ (c>>>1) : c>>>1; return c>>>0; }));
  let x = ~0; for (const b of buf) x = t[(x ^ b) & 255] ^ (x >>> 8); return (~x) >>> 0;
}
function zip(files) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), data = f.data;
    const crc = crc32(data);
    const local = new Uint8Array(30 + name.length + data.length);
    const v = new DataView(local.buffer);
    v.setUint32(0, 0x04034b50, true); v.setUint16(8, 0, true); v.setUint32(14, crc, true); v.setUint32(18, data.length, true); v.setUint32(22, data.length, true); v.setUint16(26, name.length, true);
    local.set(name, 30); local.set(data, 30 + name.length);
    parts.push(local);
    const cen = new Uint8Array(46 + name.length);
    const cv = new DataView(cen.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true); cv.setUint16(28, name.length, true); cv.setUint32(42, offset, true);
    cen.set(name, 46); central.push(cen); offset += local.length;
  }
  const csize = central.reduce((s, x) => s + x.length, 0);
  const end = new Uint8Array(22); const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, central.length, true); ev.setUint16(10, central.length, true); ev.setUint32(12, csize, true); ev.setUint32(16, offset, true);
  const blob = new Blob([...parts, ...central, end], { type: 'application/zip' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'glass-pack.zip'; a.click();
}
async function pngBytes(size) {
  const out = document.createElement('canvas'); out.width = out.height = size;
  out.getContext('2d').drawImage(c, 0, 0, size, size);
  const blob = await new Promise(r => out.toBlob(r, 'image/png'));
  return new Uint8Array(await blob.arrayBuffer());
}
document.getElementById('pack').onclick = async () => {
  const name = document.getElementById('name').value || 'glass';
  const snippet = `<link rel="apple-touch-icon" href="${name}-180.png">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-title" content="${name}">`;
  zip([
    { name: name + '-1024.png', data: await pngBytes(1024) },
    { name: name + '-180.png', data: await pngBytes(180) },
    { name: 'webclip.html.txt', data: new TextEncoder().encode(snippet) }
  ]);
};

</dict></array>

  const a = document.createElement('a');

};
function state() {
  return { symbol, shadowMode, plateOn, tint: document.getElementById('tint').value, plate: document.getElementById('plate').value, op: document.getElementById('op').value, rim: document.getElementById('rim').value, iri: document.getElementById('iri').value, rad: document.getElementById('rad').value, sh: document.getElementById('sh').value, sc: document.getElementById('sc').value, glyph: document.getElementById('glyph').value, name: document.getElementById('name').value, url: document.getElementById('url').value };
}
function loadPresets() {
  const all = JSON.parse(localStorage.getItem(KEY) || '{}');
  const sel = document.getElementById('presets');
  sel.innerHTML = '<option value="">Mẫu</option>' + Object.keys(all).map(k => `<option>${k}</option>`).join('');
  sel.onchange = () => {
    const p = all[sel.value]; if (!p) return;
    Object.entries(p).forEach(([k,v]) => { const el = document.getElementById(k); if (el) el.value = v; });
    symbol = p.symbol; plateOn = p.plateOn; shadowMode = p.shadowMode;
    document.getElementById('plateOn').classList.toggle('on', plateOn);
    document.querySelectorAll('[data-shadow]').forEach(x => x.classList.toggle('on', x.dataset.shadow === shadowMode));
    draw();
  };
}
document.getElementById('savePreset').onclick = () => {
  const all = JSON.parse(localStorage.getItem(KEY) || '{}');
  all[document.getElementById('name').value || 'Mẫu'] = state();
  localStorage.setItem(KEY, JSON.stringify(all));
  loadPresets();
};
